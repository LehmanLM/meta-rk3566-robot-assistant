[Unit]
# The upstream unit gates adbd on /var/usb-debugging-enabled which may live
# on a tmpfs-backed /var with read-only-rootfs. We want adbd always.
ConditionPathExists=

[Service]
# configfs is not mounted automatically; android-gadget-setup expects it.
ExecStartPre=/bin/sh -c 'grep -qs " /sys/kernel/config " /proc/mounts || mount -t configfs configfs /sys/kernel/config'
