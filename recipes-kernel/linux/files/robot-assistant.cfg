# 机器人助手内核配置增量（基座 = 内核树 rockchip_linux_defconfig）
# 首启验证最小集：USB 串口/网卡 gadget（调试）+ WiFi brcmfmac + ext4 SD 卡

# USB gadget 调试通路（串口 + RNDIS 网卡）
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_SERIAL=y
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_F_SERIAL=m
CONFIG_USB_F_ACM=m
CONFIG_USB_F_RNDIS=m
CONFIG_USB_G_ANDROID=m
CONFIG_USB_DWC3=y
CONFIG_USB_DWC3_DUAL_ROLE=y

# WiFi：实测芯片为 AP6212A1（BCM43430A1，2.4G only；dts wifi_chip_type=ap6212 正确）
# brcmfmac 内建免模块安装；lckfb defconfig 的 BCMDHD=y 走 Android 固件路径，关闭防冲突
CONFIG_BRCMUTIL=y
# CONFIG_BRCMSMAC is not set
CONFIG_BRCMFMAC=y
CONFIG_BRCMFMAC_SDIO=y
CONFIG_CFG80211=y
CONFIG_MAC80211=y
# CONFIG_BCMDHD is not set

# SD 卡 rootfs
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y

# 3.1" MIPI 屏 fbcon：控制台/开机日志上屏（DRM fbdev 仿真）
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_FBDEV_OVERALLOC=100
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y

# 内核瘦身：去掉 DWARF 调试信息（boot 分区 19148KiB 装不下带 debug 的内核，
# 关掉后 Image.lz4 大幅缩小，与旧内核兼容；需要深调试时临时打开）
# CONFIG_DEBUG_INFO is not set
