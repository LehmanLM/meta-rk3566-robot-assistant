#@TYPE: Machine
#@NAME: lckfb TaishanPi 1M (RK3566)
#@DESCRIPTION: 立创泰山派 1M 核心板（lckfb tspi V10），机器人助手产品线

require conf/machine/include/rk356x.inc

# 泰山派 dts：从 lckfb kernel6.1 SDK 移植（src/kernel commit 29329df39）
# gmac1(扩展板千兆网)/dsi/edp 已关，CSI ov5695 + HDMI + RK809 音频 + AP6256 SDIO WiFi 开
KERNEL_DEVICETREE = "rockchip/tspi-rk3566-user-v10-linux.dtb"

UBOOT_MACHINE = "rk3568_defconfig"

# BSP 内核 4.19 → vendor 6.1（与 src/kernel 同源）
PREFERRED_VERSION_linux-rockchip := "6.1%"
LINUXLIBCVERSION := "6.1-custom%"

SERIAL_CONSOLES := "1500000;ttyFIQ0"

# WiFi/BT：AP6256（brcmfmac43456-sdio），固件后续迭代加包
RK_WIFIBT_RRECOMMENDS = ""
