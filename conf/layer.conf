BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bbappend"

BBFILE_COLLECTIONS += "rk3566-robot-assistant"
BBFILE_PATTERN_rk3566-robot-assistant = "^${LAYERDIR}/"
BBFILE_PRIORITY_rk3566-robot-assistant = "10"

LAYERVERSION_rk3566-robot-assistant = "1"

# 立创泰山派 RK3566 机器人助手：内核 6.1 recipe 与 u-boot/rkbin 均来自
# meta-rockchip，板级 dts 在本层 bbappend 指定；不依赖 game-player/voice-assistant
LAYERDEPENDS_rk3566-robot-assistant = "core rockchip openembedded-layer"

LAYERSERIES_COMPAT_rk3566-robot-assistant = "scarthgap"
