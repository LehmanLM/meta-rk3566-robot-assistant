# 播放并发 + 录音直通（asym：default 同时服务 aplay/arecord）
# - 播放走 dmix：robot-voice TTS/应答 与 robot-ui 音效共享混音，
#   避免互相 Device busy 抢卡（唤醒时"我在"+boing 曾互相顶掉）
# - 录音走 plughw 直通：dmix 是纯播放插件，default 全量指 dmix 会让
#   arecord 打不开（EOFError: arecord 流结束 死循环，踩过）
pcm.!default {
    type asym
    playback.pcm {
        type plug
        slave.pcm {
            type dmix
            ipc_key 1024
            slave {
                pcm "hw:0,0"
                rate 48000
                format S16_LE
            }
        }
    }
    capture.pcm "plughw:CARD=0"
}
